# The emulator, a crate for each part of the machine, so that each builds and tests on its own:
# `cargo test -p z80` touches nothing but the CPU. docs/architecture.md says what each is and how they meet.
# And the server (crates/app), on crux's parts, copied into crux/ by `nerd crux` (nerd.toml's [crux]).
[workspace]
resolver = "3"
members = [
  "crates/z80",
  "crates/audio",
  "crates/ay",
  "crates/tape",
  "crates/snapshot",
  "crates/unzip",
  "crates/spectrum",
  "crates/wasm",
  "crates/cli",
  "crates/app",
  "crux/server",
  "crux/telemetry",
  "crux/widget",
  "crux/load",
  "crux/wasm",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
z80 = { path = "crates/z80" }
audio = { path = "crates/audio" }
ay = { path = "crates/ay" }
tape = { path = "crates/tape" }
snapshot = { path = "crates/snapshot" }
unzip = { path = "crates/unzip" }
spectrum = { path = "crates/spectrum" }
# Where each of crux's parts is, for the server and for a part that depends on another (crux/widget and crux/load on
# server; crux/server's and crux/load's tests on the rest).
server = { path = "crux/server" }
telemetry = { path = "crux/telemetry" }
widget = { path = "crux/widget" }
load = { path = "crux/load" }
# Inflate and deflate, in Rust alone (no C), so that it compiles to WebAssembly as it is: zip archives, CSW
# tapes, SZX snapshots, PNG screenshots.
miniz_oxide = "0.8"
# For tests only: the CPU test suites come as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The emulator's: the WebAssembly the page runs, and zx's corpus.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The server's build for the image (Dockerfile): optimised, but not as the emulator is, at a cost of minutes a deploy
# for nothing a reader would notice; and a panic in one request is that request's, not the end of the server.
[profile.server]
inherits = "release"
lto = "thin"
codegen-units = 16
panic = "unwind"

# An emulator is unusably slow unoptimised, and its test suites run billions of instructions: optimise, and keep
# the debug assertions and overflow checks, which catch arithmetic that wraps where the hardware would not.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
