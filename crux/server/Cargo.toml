[package]
name = "server"
version = "0.1.0"
# Said here, not taken from a workspace: a product takes this directory as it is (crux's CLAUDE.md).
edition = "2021"
license = "Apache-2.0"
description = "The shell a product's pages are served from: every file held in memory, its bytes shared; text compressed once, with brotli and gzip at their best, and never sent larger; tags and 304s; a range of a file sent as it is, with 206 and 416; the table swapped whole; a built directory served whole, its own .br and .gz, its hashed assets kept a year, its app's page for a route, the product's headers by path, and on every answer its router makes; served with axum on $PORT, a client that stops reading let go of."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
brotli = "8"
bytes = "1"
flate2 = "1"
# The part telemetry, where the product's workspace says it is, as every product that takes this part takes it too: a
# panic is said as it says an error (crux#42).
telemetry = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }


# What examples/dir.rs, a product's main.rs serving its built directory, takes beside this part: the parts a new
# product starts with, where the product's workspace says they are, as scaffold/server's Cargo.toml says them all.
[dev-dependencies]
load = { workspace = true }
widget = { workspace = true }
# The line a panic is said with, read back by tests/panic.rs.
serde_json = "1"
# The answers tests/conn.rs streams to a client that stops reading, as axum takes a stream.
futures-core = "0.3"

# A server whose route panics, in a process of the test's own, as the hook is the process's: a main of its own.
[[test]]
name = "panic"
harness = false
