[package]
name = "zx-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The emulator as the browser runs it: a C interface over `spectrum`, compiled to WebAssembly
# (scripts/build-wasm.sh). Also an rlib, so that the same interface runs natively: its own tests, and
# examples/digest.rs, which the wasm build is held to (web/tests/wasm.mjs).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spectrum.workspace = true
snapshot.workspace = true
