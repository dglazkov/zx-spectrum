[package]
name = "tape"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Tapes: TAP, TZX 1.20 (every block), CSW 1 and 2, PZX; a player that turns them into the EAR line's level at
# any T-state of the machine's clock, the instant load that the ROM's LD-BYTES trap takes, and a recorder that
# turns the MIC line back into TAP blocks. It knows nothing of the Spectrum but its tape signal.
[dependencies]
# CSW's Z-RLE (and TZX block 0x18 that carries it) is zlib-deflated.
miniz_oxide.workspace = true

[dev-dependencies]
miniz_oxide.workspace = true
