[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The deployed server (docs/web.md): the page built into web/dist, served by crux's part server with nerd's widget,
# each load measured (load) and nerd's paths (telemetry); and the pass-through to the archive and ZXInfo, answering
# from the ZXDB's own index where ZXInfo cannot. `cargo run -p app -- web/dist`; `app zxdb INDEX PATH` asks the index.
[dependencies]
server.workspace = true
telemetry.workspace = true
widget.workspace = true
load.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
# The archive and ZXInfo, over TLS with roots of its own (the image has none), their bodies decoded as a browser's
# fetch decodes them.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
form_urlencoded = "1"
flate2 = "1"
unicode-normalization = "0.1"
serde_json.workspace = true

[dev-dependencies]
flate2 = "1"
