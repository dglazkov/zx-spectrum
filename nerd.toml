# What nerd needs to know to deploy this project. `nerd guide` lists what else can go here.
name = "zx-spectrum"

# The tests, a layer each, fastest first: `nerd test` runs the ones that cover what changed. Each crate is built
# into a target directory of its own, so that tests side by side do not wait on one another's build lock.
# Fixtures that are not ours to commit are fetched by scripts/fixture into a cache; a test whose fixture cannot be
# fetched reports itself skipped.

# The CPU, instruction by instruction: every opcode's result, flags, MEMPTR and timing, and the order and timing of
# its bus cycles, against the FUSE test suite, the first 25 SingleStepTests of every opcode, z80test's full, CCF and
# MEMPTR variants (CRCs measured on a real Zilog Z80), and its own tests of interrupts, HALT and the disassembler;
# and how fast it runs (ZEXDOC's first 200M instructions, reported, never judged). Under ten seconds.
[[test]]
name = "z80"
run = "CARGO_TARGET_DIR=target/test-z80 cargo test -q -p z80"
covers = ["crates/z80/**", "Cargo.toml", "fixtures.txt"]
limit = "2m"

[[test]]
name = "audio"
run = "CARGO_TARGET_DIR=target/test-audio cargo test -q -p audio -p ay"
covers = ["crates/audio/**", "crates/ay/**", "Cargo.toml"]
limit = "1m"

# Tapes: every TAP, TZX, CSW and PZX block built to its specification and played to the T-state, loaded by a
# model of the ROM's LD-BYTES at both clocks, Saboteur's tapes played through, SAVE recorded back (docs/tape.md);
# about a second to run.
[[test]]
name = "tape"
run = "CARGO_TARGET_DIR=target/test-tape cargo test -q -p tape"
covers = ["crates/tape/**", "Cargo.toml", "fixtures.txt"]
limit = "1m"

# Snapshots and zips: .z80 (v1-v3), .sna and .szx built byte by byte from their specifications and round-tripped
# through each writer, damaged files (and thousands damaged at random from a fixed seed), and 26 real files from the
# archive (docs/snapshot.md); a few seconds.
[[test]]
name = "snapshot"
run = "CARGO_TARGET_DIR=target/test-snapshot cargo test -q -p snapshot -p unzip"
covers = ["crates/snapshot/**", "crates/unzip/**", "Cargo.toml", "fixtures.txt"]
limit = "1m"

# The CPU's exhaustive suites, slow and so a layer of their own, last: all 1,604,000 SingleStepTests (a few seconds
# on 8 threads), ZEXDOC and ZEXALL side by side (5.8 billion instructions each, about 80 s on this machine), and
# z80test's three narrower variants.
# They run when the CPU changes, or by name.
[[test]]
name = "z80-suites"
run = "CARGO_TARGET_DIR=target/test-z80 cargo test -q -p z80 -- --ignored"
covers = ["crates/z80/**"]
limit = "5m"

# The page (web/, docs/web.md): its TypeScript checked whole, in a second or two.
[[test]]
name = "web-types"
run = "cd web && npm run --silent typecheck"
covers = ["web/src/**", "web/tsconfig.json", "web/vite.config.ts", "web/server.d.mts", "web/package.json", "web/package-lock.json"]
limit = "1m"

# The page's parts without a browser (Vitest): the key mappings and the ROM-paced typing (against a model of the
# ROM's KEYBOARD routine), the frame scheduler on simulated clocks, the file chosen from ZXInfo's recorded answers,
# the keyboard's legends against roms/48.rom, the stand-in emulator, rewinding, settings, the server's pass-through.
# A few seconds.
[[test]]
name = "web-unit"
run = "cd web && npm run --silent test:unit"
covers = ["web/src/**", "web/tests/*.test.mjs", "web/tests/fixtures/**", "web/server.mjs", "web/vite.config.ts", "web/package-lock.json", "roms/48.rom"]
limit = "1m"

# The page in Chrome against the stand-in, on the page's own clock (Playwright's page.clock): ready, rendering, keys,
# tapes, the library (answered from recordings), snapshots, rewind, settings, sound, a phone. Four parts at a time,
# each reported; those a change cannot touch are skipped. About 40 s; WebGL is drawn in software (SwiftShader).
[[test]]
name = "web-page"
run = "cd web && node tests/page.mjs"
covers = ["web/src/**", "!web/src/**/*.test.ts", "web/index.html", "web/public/**", "web/tests/page.mjs", "web/tests/fixtures/**", "web/vite.config.ts", "web/server.mjs", "web/package-lock.json", "roms/48.rom"]
limit = "2m"

# The machine (crates/spectrum) and zx (crates/cli), on programs the tests build and the ROMs alone: every model
# booting; contention by model, memory and I/O, T-state by T-state; the floating bus; the border's latch; port
# FEh, Issue 2 and 3, the Kempston; paging and its lock; LD-BYTES loaded at once and from the edges alike; SAVE
# recorded as a TAP; typing at the ROM's pace; snapshots and the fast state, bit for bit; breakpoints, NMI, the
# AY, snow; every zx command. A few seconds.
[[test]]
name = "machine"
run = "CARGO_TARGET_DIR=target/machine cargo test -q -p spectrum && CARGO_TARGET_DIR=target/machine cargo test -q -p zx-cli --lib --bins --test cli"
covers = ["crates/spectrum/**", "crates/cli/**", "!crates/cli/tests/corpus/**", "crates/z80/src/**", "crates/audio/src/**", "crates/ay/src/**", "crates/tape/src/**", "crates/snapshot/src/**", "crates/unzip/src/**", "roms/**", "Cargo.toml"]
limit = "2m"

# The test corpus (docs/test-corpus.md, docs/machine.md): the real software, held to what real hardware shows.
# z80test through the tape, fusetest on four models, the Butlers' timing tests, Minfo, ULA test 3, Rak's timing
# test against ten captures, Floating Spy, azesmbog's ULA pictures, Woodmass's tests, the +2A/+3's floating bus
# and paging; Saboteur from its TZX (stripes, loading screen, REWARD, a game) and instantly; twenty more games
# and demos; the state bit for bit; the snapshot fixtures round-tripped. A part a program, side by side on up to
# eight threads, each reported with its time in emulated seconds (never the wall clock); a release build. Words
# after the command choose parts by name: `nerd test corpus saboteur`.
[[test]]
name = "corpus"
run = "CARGO_TARGET_DIR=target/machine cargo test --release -q -p zx-cli --test corpus"
covers = ["crates/spectrum/**", "crates/cli/src/lib.rs", "crates/cli/src/image.rs", "crates/cli/src/script.rs", "crates/cli/tests/corpus/**", "crates/z80/src/**", "crates/audio/src/**", "crates/ay/src/**", "crates/tape/src/**", "crates/snapshot/src/**", "crates/unzip/src/**", "roms/**", "Cargo.toml", "fixtures.txt"]
limit = "10m"
